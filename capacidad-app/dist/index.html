## 1. Maestros

Carga los CSV con los datos base de planificación. Son **obligatorios** para el motor: \`DEMANDA\`, \`PRODUCTO\`, \`ENRUTAMIENTO_MEZCLAS\`, \`CALENDARIO\`. El maestro \`MEZCLAS\` es opcional — solo se necesita si las fórmulas usan el modelo de cuellos.

\x3C!-- detalles -->
Cada maestro se importa con el wizard de 4 pasos: subir CSV, mapear columnas, validar e importar. El validador detecta tipos (\`fecha\`, \`decimal\`, \`string\`, \`boolean\`) y reporta filas erróneas antes de aceptar la importación. Acepta separadores \`,\`, \`;\`, tab o \`|\` y codificaciones UTF-8 / Latin-1.
\x3C!-- /detalles -->

## 2. Verificaciones

Cruces entre maestros para detectar inconsistencias antes de calcular. Cuatro verificaciones disponibles: refs sin producto (V1), refs sin mezcla asignada (V2), mezclas sin enrutamiento (V3), mezclas con demanda sin ficha en MEZCLAS (V4).

\x3C!-- detalles -->
Cada verificación produce una tabla con la lista de afectados. Las tarjetas se vuelven ámbar si hay alertas y verdes si están OK. No bloquean el cálculo, pero conviene resolver las alertas críticas (V1 y V3) antes de avanzar.
\x3C!-- /detalles -->

## 3. Reglas

Define cómo expandir los maestros a las tablas intermedias. Dos conjuntos: \`PRODUCTO_A_COMPLEJO\` (genera variantes Simple/Doble por referencia) y \`ENRUTAMIENTO_A_FACTIBLE\` (filtra rutas factibles).

## 4. Intermedias

Aplica las reglas para generar \`PRODUCTO_COMPLEJO\`. Esta tabla derivada cruza referencias × variantes (Simple / Doble) y filtra por demanda, por lo que solo aparecen las referencias con demanda real.

## 5. Cálculos

Define las fórmulas de **RS** (relación de soplado) y **RENDIMIENTO** (kg/h). Para el modelo de cuellos de botella, RENDIMIENTO se calcula como el mínimo de varios cuellos físicos (Q_HUSILLO, Q_DSO, Q_LINEA, Q_POST). Carga el modelo por defecto desde el botón **"Cargar modelo por defecto"**.

\x3C!-- detalles -->
El constructor visual permite armar árboles de fórmula con operaciones aritméticas, n-arias (min/max), condicionales (\`si_aplica\`), booleanas (and/or/not) y referencias a otros cálculos. El motor evalúa los cálculos en orden topológico, detecta ciclos y propaga \`null\` aguas arriba en aritmética.
\x3C!-- /detalles -->

## 6. Intermedias Calculadas

Evalúa las fórmulas sobre el cruce PRODUCTO_COMPLEJO × MEZCLA × EXTRUSORA. Produce \`ENRUTAMIENTOS\` (todas las combinaciones) y \`ENRUTAMIENTOS_FACTIBLES\` (solo las que cumplen rangos RS y están dentro de la configuración actual).

## 7. Setup Extrusoras

Configuraciones físicas de cada extrusora (capas, hilera, husillos, VMAX, D_DIE, COOLING_FACTOR, etc.). Una configuración por extrusora se marca como **\`ES_ACTUAL\`** y es la usada por el motor. Las ediciones del modal se aplican al estado en memoria — exporta a CSV si quieres conservarlas.

## 8. Resultados — Escenario 0

Ejecuta el cálculo anual de capacidad (Rough Cut). Asigna la demanda de cada referencia a las combinaciones (variante × CM) factibles minimizando la ocupación pico. Devuelve resumen por CM (horas disponibles, horas cargadas, ocupación) y detalle por referencia.

\x3C!-- detalles -->
Es un LP continuo resuelto con water-filling entrópico: 300 iteraciones de annealing con blending (LR=0.15). El objetivo bifásico es minimizar primero la ocupación pico de cualquier CM y, después, la suma de ocupaciones. La barra de progreso muestra el avance en tiempo real.
\x3C!-- /detalles -->

---

## Dependencias entre pasos

- **Verificaciones** necesitan los 4 maestros core (+ MEZCLAS para V4).
- **Intermedias** necesitan \`PRODUCTO\` y \`DEMANDA\` cargados y reglas definidas.
- **Cálculos** son independientes de los maestros — solo definen fórmulas.
- **Intermedias Calculadas** necesitan PRODUCTO_COMPLEJO + ENRUTAMIENTO_MEZCLAS + SETUP_EXTRUSORAS + Cálculos. Si las fórmulas usan campos de MEZCLAS, también el maestro MEZCLAS.
- **Resultados (Escenario 0)** necesitan ENRUTAMIENTOS_FACTIBLES + DEMANDA + CALENDARIO.
`,Ex='RCCapacity trabaja con **7 maestros** entre fuentes originales y tablas derivadas. Los 4 primeros son obligatorios para el motor; los demás cubren casos específicos.\n\n## DEMANDA\n\nUnidades demandadas por mes y referencia. Es el punto de partida: solo se calculan referencias que aparecen aquí. Al importar, se agrega por `MES + REFERENCIA` (si el CSV trae duplicados, se suman).\n\n{{MAESTRO:DEMANDA}}\n\n## PRODUCTO\n\nCatálogo de referencias con sus atributos físicos. Cruza con DEMANDA por `REFERENCIA` y con MEZCLAS por `MEZCLA`. El campo `TIPO` define si la referencia se expande a variante Simple, Doble o ambas en las reglas de Producto Complejo.\n\n{{MAESTRO:PRODUCTO}}\n\n\x3C!-- detalles -->\n- `ANCHO (MM)` es el ancho extendido del film, no el ancho de cabezal (eso vive en SETUP_EXTRUSORAS como `D_DIE`).\n- `MEZCLA` debe coincidir literalmente con la clave del maestro MEZCLAS y con la columna `MEZCLA` de ENRUTAMIENTO_MEZCLAS.\n- Campos `TRATAMIENTO` y `ABREFACIL` son señales: activan los cuellos `Q_POST_CORONA` y `Q_POST_ABREFACIL` del modelo de rendimiento.\n\x3C!-- /detalles -->\n\n## ENRUTAMIENTO_MEZCLAS\n\nDefine qué extrusoras pueden producir cada mezcla y con qué rango de RS. Una mezcla puede asignarse a varias extrusoras; cada combinación tiene su rango propio.\n\n{{MAESTRO:ENRUTAMIENTO_MEZCLAS}}\n\n\x3C!-- detalles -->\n`RS MIN` y `RS MÁXIMO` definen la ventana operativa: si la RS calculada para una combinación cae fuera del rango, ENRUTAMIENTOS la marca como no factible. `GMAX SOLDADURA` es el grosor máximo permitido cuando la referencia requiere soldadura longitudinal.\n\x3C!-- /detalles -->\n\n## CALENDARIO\n\nHoras disponibles por centro de mecanizado (CM) y mes. Usado por el Escenario 0 para calcular la capacidad anual de cada CM.\n\n{{MAESTRO:CALENDARIO}}\n\n\x3C!-- detalles -->\n`HORAS_EFICIENTES` = `HORAS_TOTALES` × `EFICIENCIA`. Es el campo que el motor usa realmente. Si no se proporciona, se rechaza la fila. El Escenario 0 agrega por CM sumando todos los meses del año.\n\x3C!-- /detalles -->\n\n## MEZCLAS (opcional)\n\nPropiedades físicas de cada mezcla para el modelo de cuellos de botella. Solo es necesario si las fórmulas activas usan campos de esta fuente (típicamente RENDIMIENTO con el modelo de cuellos).\n\n{{MAESTRO:MEZCLAS}}\n\n\x3C!-- detalles -->\n- `K_HUSILLO`: factor de eficiencia del husillo para la mezcla (~0,75-1,00).\n- `DSO_EF`: Die Specific Output en kg/h por mm de perímetro de hilera (~0,07-0,30).\n- `RHO_FILM`: densidad del film sólido en kg/m³ (~918-955).\n- `PCT_PCR` y `RESINA_DOMINANTE` son documentales — no entran en las fórmulas estándar.\n\x3C!-- /detalles -->\n\n## SETUP_EXTRUSORAS\n\nConfiguraciones físicas de cada extrusora. Una extrusora puede tener varias configuraciones (`NOMBRE_EXTRUSORA` agrupa); exactamente **una** debe estar marcada como `ES_ACTUAL=true` por extrusora — esa es la que usa el motor.\n\n{{MAESTRO:SETUP_EXTRUSORAS}}\n\n\x3C!-- detalles -->\nLos últimos cinco campos (`D_DIE`, `COOLING_FACTOR`, `CORONA_KW`, `V_MAX_SOLDADOR`, `V_MAX_ABREFACIL`) son los parámetros del modelo de cuellos. El modal de Setup Extrusoras los agrupa en la sección "Parámetros de rendimiento".\n\nLa invariante `ES_ACTUAL` tiene **scope por extrusora**: una extrusora con 3 configuraciones tiene exactamente un `true` entre ellas, independientemente de otras extrusoras. Al importar un CSV que la viola, el sistema corrige automáticamente y deja un warning en el log.\n\x3C!-- /detalles -->\n\n## PRODUCTO_COMPLEJO (derivado)\n\nTabla intermedia generada a partir de PRODUCTO + reglas de expansión Simple/Doble + filtrado por referencias con demanda. No se importa: se calcula desde la sección **Intermedias basado en reglas**.\n\n{{MAESTRO:PRODUCTO_COMPLEJO}}\n\n\x3C!-- detalles -->\nCada referencia base genera 0, 1 o 2 filas (Simple, Doble, ambas) según las reglas. Los campos `TIPO_PRODUCTO`, `ABREFACIL`, `TRATADA` y los flags `SOLDADOR_LONGITUDINAL`, `ABIERTA_*`, `ABREFACIL_*` se derivan de la combinación regla × producto base.\n\x3C!-- /detalles -->\n\n---\n\n## Cruces clave\n\n- `DEMANDA.REFERENCIA → PRODUCTO.REFERENCIA` — alerta si falta (V1).\n- `PRODUCTO.MEZCLA → MEZCLAS.MEZCLA` — alerta si falta (V4) y la fórmula usa MEZCLAS.\n- `PRODUCTO.MEZCLA → ENRUTAMIENTO_MEZCLAS.MEZCLA` — alerta si falta (V3).\n- `ENRUTAMIENTO_MEZCLAS.EXTRUSORA → SETUP_EXTRUSORAS.NOMBRE_EXTRUSORA` — el motor solo evalúa la configuración con `ES_ACTUAL=true`.\n- `CALENDARIO.CM` agrupa horas; el Escenario 0 ofrece capacidad por CM.\n',Op=[{id:"flujo",titulo:"Flujo de trabajo",descripcion:"Orden canónico de los 8 pasos y dependencias entre ellos.",md:xx,icono:a.jsx("svg",{viewBox:"0 0 20 20",fill:"currentColor",className:"ayuda-card-icon",children:a.jsx("path",{fillRule:"evenodd",d:"M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z",clipRule:"evenodd"})})},{id:"maestros",titulo:"Maestros",descripcion:"Las 7 fuentes de datos: columnas, tipos, cruces y obligatoriedad.",md:Ex,icono:a.jsxs("svg",{viewBox:"0 0 20 20",fill:"currentColor",className:"ayuda-card-icon",children:[a.jsx("path",{d:"M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"}),a.jsx("path",{fillRule:"evenodd",d:"M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z",clipRule:"evenodd"})]})}];function Sx(){return a.jsxs(a.Fragment,{children:[a.jsxs("div",{className:"page-header",children:[a.jsx("h1",{className:"page-title",children:"AYUDA"}),a.jsx("p",{className:"page-subtitle",children:"Documentación de RCCapacity. Selecciona una sección para empezar."})]}),a.jsx("div",{className:"page-body",children:a.jsx("div",{className:"ayuda-cards",children:Op.map(e=>a.jsxs(Di,{to:`/ayuda/${e.id}`,className:"ayuda-card",children:[a.jsx
